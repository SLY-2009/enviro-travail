<script>
/* Pont entre l'interface et Google : reproduit, avec les API Gmail et Agenda,
   les « outils » que la version web obtenait des connecteurs de claude.ai.
   Les jetons restent dans la partie Rust ; ici, on ne fait que demander des requêtes. */
(() => {
"use strict";
const T = window.__TAURI__;
if (!T) return; // ouvert hors de l'application : on ne touche à rien

  closeGate();
  let st = { configured: false, connected: false };
  try { st = await inv("google_status"); } catch (e) {}
  const box = el("div", "max-width:480px;width:92%;background:var(--card,#fff);color:var(--tx,#1c1c1a);border:1px solid var(--bd,#dcdad2);border-radius:14px;padding:22px;box-shadow:0 10px 40px rgba(0,0,0,.25)");
  gateEl = el("div", "position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;font:14px system-ui,sans-serif", null, [box]);
  box.append(el("h2", "margin:0 0 10px;font-size:18px", "Connexion à Google"));
  if (msg) box.append(el("p", "color:#c0392b;margin:0 0 10px", msg));
  const err = el("p", "color:#c0392b;min-height:1.2em;margin:8px 0 0");
  const inStyle = "width:100%;padding:7px;margin:4px 0 10px;box-sizing:border-box;border:1px solid var(--bd,#ccc);border-radius:6px;background:var(--card,#fff);color:inherit";
  const btn = (txt, fn, primary) => { const b = el("button", "padding:7px 14px;border-radius:8px;border:1px solid var(--bd,#ccc);cursor:pointer;margin-right:8px;" + (primary ? "background:#2f5d50;color:#fff;border-color:#2f5d50" : "background:var(--card,#fff);color:inherit"), txt); b.onclick = async () => { b.disabled = true; try { await fn(); } catch (e) { err.textContent = String(e && e.message || e); b.disabled = false; } }; return b; };

function rThread(b){b.textContent="";

  if(t){hd.append(tagBtn(t,"rep"),tagBtn(t,"lire"),h("button",{class:"btn sm",text:"Archiver",onclick:async()=>{await archive(t);if(!mails.some(m=>m.id===ot))closePane()}}))}

      h("div",{class:"sn",text:"À : "+(m.toRecipients||[]).map(nm).join(", ")+((m.ccRecipients||[]).length?" · Cc : "+m.ccRecipients.map(nm).join(", "):"")}),
      h("div",{class:"bd",text:full?body:body.slice(0,2500)+"…"}),

/* ---------- Planning (vue type Google Agenda) ---------- */
const HH=44,pd=k=>{const[y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d)};
const addD=(k,n)=>{const d=pd(k);d.setDate(d.getDate()+n);return dk(d)};
const monK=k=>{const d=pd(k);d.setDate(d.getDate()-((d.getDay()+6)%7));return dk(d)};
function openEv(e){openPane("ev",e.id)}
function toPlanning(k,id){nav.push(snapN());tab="cal";ag="grid";gv=id?"week":"day";gd=k;selEv=id||"";fx=id?{k:"ev",id}:null;pn=null;sv("enviro.tab","cal");sv("enviro.ag2","grid");window.scrollTo(0,0);renderAll()}
function lanes(list){list.sort((a,b)=>a.s-b.s||b.en-a.en);
  let cl=[],cur=null,mx=-1;
  for(const it of list){if(!cur||it.s>=mx){cur=[];cl.push(cur);mx=-1}cur.push(it);mx=Math.max(mx,it.en)}
  for(const c of cl){const ends=[];for(const it of c){let l=ends.findIndex(x=>x<=it.s);if(l<0){l=ends.length;ends.push(0)}ends[l]=it.en;it.l=l}for(const it of c)it.n=ends.length}}
function rGrid(b){b.textContent="";
  if(stateMsg("rng",b))return;
  const now=new Date(),td=dk(now),minK=monK(td),maxK=dk(new Date(now.getFullYear(),now.getMonth()+3,0));
  if(gd<minK)gd=minK;if(gd>maxK)gd=maxK;
  const days=gv==="day"?[gd]:Array.from({length:7},(_,i)=>addD(monK(gd),i));
  const by={};for(const e of ev3)for(const k of evDays(e))(by[k]=by[k]||[]).push(e);
  let h0=8,h1=19;
  for(const k of days)for(const e of by[k]||[]){const s=e.start||{};if(!s.dateTime)continue;const a=new Date(s.dateTime),z=new Date((e.end||{}).dateTime||s.dateTime);
    h0=Math.min(h0,a.getHours());h1=Math.max(h1,dk(z)===k?z.getHours()+(z.getMinutes()?1:0):24)}
  h1=Math.min(24,Math.max(h1,h0+1));
  const fmt=new Intl.DateTimeFormat("fr-FR",{day:"numeric",month:"short"});
  const title=gv==="day"?cap(fDay.format(pd(gd))):fmt.format(pd(days[0]))+" – "+fmt.format(pd(days[6]))+" "+pd(days[6]).getFullYear();
  const mv=n=>{const k=addD(gd,n);if(k<minK||k>maxK){toast("Hors de la période chargée (cette semaine à 3 mois).");return}gd=k;selEv="";renderAll()};
  const sg=h("div",{class:"seg"});
  for(const[k,l]of[["day","Jour"],["week","Semaine"]])sg.append(h("button",{class:gv===k?"on":"",text:l,onclick:()=>{gv=k;sv("enviro.gv",k);renderAll()}}));
  b.append(h("div",{class:"gc"},h("button",{class:"btn",text:"‹",title:"Précédent",onclick:()=>mv(gv==="day"?-1:-7)}),h("button",{class:"btn",text:"Aujourd’hui",onclick:()=>{gd=td;selEv="";renderAll()}}),h("button",{class:"btn",text:"›",title:"Suivant",onclick:()=>mv(gv==="day"?1:7)}),h("b",{text:title}),h("span",{class:"sp",style:"flex:1"}),sg));
  const g=h("div",{class:"gg"});g.style.gridTemplateColumns="44px repeat("+days.length+",minmax(80px,1fr))";g.style.minWidth=(44+days.length*80)+"px";
  g.append(h("div",{class:"gl"}));
  for(const k of days){const d=pd(k);g.append(h("button",{class:"gh"+(k===td?" td":""),title:"Voir ce jour",onclick:()=>{gd=k;gv="day";renderAll()}},h("span",{text:cap(new Intl.DateTimeFormat("fr-FR",{weekday:"short"}).format(d))}),h("b",{text:String(d.getDate())})))}
  const pick=e=>{selEv=e.id;openPane("ev",e.id)};
  const colOf=e=>{const c=IMP.find(i=>i.k===imp[e.id]);return c?c.c:"var(--ac)"};
  g.append(h("div",{class:"gl",text:"Journée"}));
  for(const k of days){const c=h("div",{class:"gad"});
    for(const e of by[k]||[]){if((e.start||{}).dateTime)continue;const x=h("button",{class:"gch"+(selEv===e.id?" sel":""),text:e.summary||"(sans titre)",title:e.summary||"",onclick:()=>pick(e)});x.style.setProperty("--c",colOf(e));c.append(x)}
    g.append(c)}
  const bh=(h1-h0)*HH,lab=h("div",{class:"gt"});lab.style.height=bh+"px";
  for(let x=h0;x<h1;x++)lab.append(h("span",{style:"top:"+((x-h0)*HH)+"px",text:x+":00"}));
  g.append(lab);
  for(const k of days){const col=h("div",{class:"gcol"+(k===td?" td":"")});col.style.height=bh+"px";
    const it=[];
    for(const e of by[k]||[]){const s=e.start||{};if(!s.dateTime)continue;const a=new Date(s.dateTime),z=new Date((e.end||{}).dateTime||s.dateTime);
      const sm=a.getHours()*60+a.getMinutes(),em=dk(z)===k?z.getHours()*60+z.getMinutes():1440;it.push({e,s:sm,en:Math.max(em,sm+30)})}
    lanes(it);
    for(const x of it){const e=x.e,hm=fHr.format(new Date(e.start.dateTime));
      const ev=h("button",{class:"ge"+(selEv===e.id?" sel":"")+(fx&&fx.k==="ev"&&fx.id===e.id?" hl":""),title:hm+" · "+(e.summary||""),onclick:()=>pick(e)},h("b",{text:e.summary||"(sans titre)"}),h("span",{text:hm}));
      ev.style.top=((x.s-h0*60)/60*HH)+"px";ev.style.height=Math.max(18,(x.en-x.s)/60*HH-2)+"px";ev.style.left=(x.l/x.n*100)+"%";ev.style.width=(100/x.n)+"%";ev.style.setProperty("--c",colOf(e));col.append(ev)}
    if(k===td){const m=now.getHours()*60+now.getMinutes();if(m>=h0*60&&m<=h1*60){const ln=h("div",{class:"gnow"});ln.style.top=((m-h0*60)/60*HH)+"px";col.append(ln)}}
    g.append(col)}
  b.append(h("div",{class:"gw"},g));
  if(!ev3.length)b.append(h("div",{class:"msg",text:"Aucun événement sur la période."}))}

/* ---------- Étiquettes Gmail ---------- */
function lbOf(t){const ids=new Set(labels.map(x=>x.labelId));return[...new Set((t.messages||[]).flatMap(m=>m.labelIds||[]))].filter(i=>ids.has(i))}
function chip(id){const x=labels.find(l=>l.labelId===id);if(!x)return null;
  const ok=v=>/^#[0-9a-f]{6}$/i.test(v||""),c=x.color||{};
  return h("span",{class:"badge",style:"background:"+(ok(c.backgroundColor)?c.backgroundColor:"var(--p4)")+";color:"+(ok(c.textColor)?c.textColor:"#fff"),text:x.name})}
const TAGS={rep:"À répondre",lire:"À lire"};
const nrm=x=>String(x||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\s+/g," ").trim();
const tagLbl=k=>labels.find(x=>nrm(x.name)===nrm(TAGS[k]));
const hasTag=(t,k)=>{const l=tagLbl(k);return !!l&&lbOf(t).includes(l.labelId)};
async function tagMail(t,k){
  try{let l=tagLbl(k);
    if(!l){const r=await mcp.callTool("Gmail","create_label",{name:TAGS[k]}),p=r&&r.payload;if(!p||!p.labelId)throw{code:"bad"};l={labelId:p.labelId,name:TAGS[k],labelType:"USER"};labels.push(l);labels.sort((a,b)=>a.name.localeCompare(b.name,"fr"))}
    const on=hasTag(t,k),ms=t.messages||[],m=ms[ms.length-1];
    if(on){await mcp.callTool("Gmail","unlabel_thread",{threadId:t.id,labelIds:[l.labelId]});if(m)m.labelIds=(m.labelIds||[]).filter(x=>x!==l.labelId)}
    else{await mcp.callTool("Gmail","label_thread",{threadId:t.id,labelIds:[l.labelId]});if(m)m.labelIds=[...(m.labelIds||[]),l.labelId]}
    renderAll();pull(k);toast(on?"« "+TAGS[k]+" » retiré":"Ajouté à « "+TAGS[k]+" »")}
  catch(e){toast("Étiquetage impossible : "+errTxt(e))}}
const tagBtn=(t,k)=>h("button",{class:"btn sm"+(hasTag(t,k)?" on":""),title:hasTag(t,k)?"Retirer l’étiquette":"Ajouter l’étiquette dans Gmail",text:TAGS[k],onclick:()=>tagMail(t,k)});
const ordered=k=>{const o=mo[k]||[],ex=k==="star"?new Set([...lists.rep,...lists.lire].map(t=>t.id)):null;
  return lists[k].filter(t=>!ex||!ex.has(t.id)).sort((a,b)=>{const x=o.indexOf(a.id),y=o.indexOf(b.id);return(x<0?1e9:x)-(y<0?1e9:y)})};
async function ensureLabel(k){let l=tagLbl(k);if(l)return l;
  const r=await mcp.callTool("Gmail","create_label",{name:TAGS[k]}),p=r&&r.payload;if(!p||!p.labelId)throw{code:"bad"};
  l={labelId:p.labelId,name:TAGS[k],labelType:"USER"};labels.push(l);labels.sort((a,b)=>a.name.localeCompare(b.name,"fr"));return l}
async function unstar(t){try{await mcp.callTool("Gmail","unlabel_thread",{threadId:t.id,labelIds:["STARRED"]});lists.star=lists.star.filter(x=>x.id!==t.id);renderAll();pull("star")}catch(e){toast("Impossible de retirer le suivi : "+errTxt(e))}}
async function moveMail(id,from,to,idx){
  const t=(lists[from]||[]).find(x=>x.id===id);if(!t||!mcp||!TAGS[to])return;
  try{const lt=await ensureLabel(to);
    await mcp.callTool("Gmail","label_thread",{threadId:id,labelIds:[lt.labelId]});
    if(from==="star")await mcp.callTool("Gmail","unlabel_thread",{threadId:id,labelIds:["STARRED"]});
    else{const lf=await ensureLabel(from);await mcp.callTool("Gmail","unlabel_thread",{threadId:id,labelIds:[lf.labelId]})}
    lists[from]=lists[from].filter(x=>x.id!==id);lists[to]=[t,...lists[to].filter(x=>x.id!==id)];
    const ids=ordered(to).map(x=>x.id).filter(x=>x!==id);ids.splice(Math.min(idx,ids.length),0,id);mo[to]=ids;sv("enviro.mo",mo);
    renderAll();pull(to);toast("Classé dans « "+TAGS[to]+" »")}
  catch(e){toast("Déplacement impossible : "+errTxt(e))}}
function mailRow(t,k,i){const ms=t.messages||[],m=ms[ms.length-1]||{},d=m.date?fShort.format(new Date(m.date)):"";
  return h("div",{class:"it lk","data-id":t.id,style:"border-left:4px solid "+(k==="star"?"var(--bd)":rankC(i))+";padding-left:8px",onclick:e=>{if(e.target.closest("button,a,select,input"))return;openMail(t)}},
    h("div",{class:"r1"},h("span",{class:"sd",text:m.sender||"—"}),h("span",{class:"dt",text:d})),
    h("div",{class:"sj",text:m.subject||"(sans objet)"}),
    h("div",{class:"act"},
      k==="star"?h("button",{class:"btn sm",text:"Retirer du suivi",title:"Retire l’étoile dans Gmail",onclick:()=>unstar(t)}):h("button",{class:"btn sm",text:"Fait",title:"Retirer l’étiquette « "+TAGS[k]+" »",onclick:()=>tagMail(t,k)}),
      h("button",{class:"btn sm",text:"Lire / Répondre",onclick:()=>openMail(t)})))}
function mailList(b,k){
  if(k!=="star")b.dataset.drop=k;
  if(stateMsg(k,b))return;
  const ths=ordered(k);
  if(!ths.length){b.append(h("div",{class:"msg",text:k==="star"?"Aucun mail suivi (étoilé) à classer. Mets une étoile sur un mail dans Gmail, puis glisse-le ici vers « À répondre » ou « À lire ».":"Aucun mail dans « "+TAGS[k]+" ». Pose cette étiquette dans Gmail, ou glisse ici un mail de « Mails suivis »."}));return}
  const box=h("div",{});ths.forEach((t,i)=>box.append(mailRow(t,k,i)));b.append(box);
  sortable(box,".it",ids=>{mo[k]=ids;sv("enviro.mo",mo);renderAll()},k,(id,to,idx)=>moveMail(id,k,to,idx))}
function lsel(t){const have=lbOf(t);
  const s=h("select",{title:"Ajouter une étiquette",onchange:()=>{if(s.value)applyLabel(t,s.value)}},h("option",{value:"",text:"+ Étiquette"}),...labels.filter(x=>!have.includes(x.labelId)).map(x=>h("option",{value:x.labelId,text:x.name})));return s}
async function applyLabel(t,id){
  try{await mcp.callTool("Gmail","label_thread",{threadId:t.id,labelIds:[id]});
    const ms=t.messages||[];if(ms.length){const m=ms[ms.length-1];m.labelIds=[...(m.labelIds||[]),id]}
    renderAll();mcp.invalidate("Gmail","search_threads").catch(()=>{});toast("Étiquette ajoutée")}
  catch(e){toast("Étiquetage impossible : "+errTxt(e))}}

/* ---------- Chargement des connecteurs ---------- */
function apply(k,res){const p=res&&res.payload;if(!p||typeof p!=="object")return;if(k==="cal"&&p.summary)owner=p.summary;
  if(k==="mail")mails=p.threads||[];else if(k==="rep"||k==="lire"||k==="star")lists[k]=p.threads||[];else events=(p.events||[]).filter(e=>e.status!=="cancelled");
  st[k]=null;loaded[k]=true;lastOk[k]=new Date();renderAll()}
async function pull(k){try{apply(k,await mcp.callTool(...Q[k],{cache:{refresh:true}}))}catch(e){softErr(k,e)}}
function softErr(k,e){e=e||{};loaded[k]=true;
  if(AUTHZ.includes(e.code)){st[k]=e;if(k==="mail")mails=[];else if(k==="rep"||k==="lire"||k==="star")lists[k]=[];else if(k==="cal")events=[]}
  else if(!lastOk[k])st[k]=e;
  else{const n=Date.now();if(n-(softErr.t||0)>60000){softErr.t=n;toast("Actualisation impossible ("+String(e.message||e.code||"erreur").slice(0,100)+") : les données affichées datent de "+fHr.format(lastOk[k]))}}
  renderAll()}
function watch(k){mcp.watchTool(...Q[k],ev=>{if(ev.type==="data")apply(k,ev.result);else softErr(k,ev.error)},{refetchInterval:60000})}

build();
(async()=>{
  try{mcp=window.claude?await window.claude.use("mcp"):null}catch{mcp=null}
  renderAll();
  loadCfg();
  if(mcp){watch("mail");watch("cal");watch("rep");watch("lire");watch("star");pullRange();setInterval(()=>pullRange(true),300000);
    mcp.callTool("Gmail","list_labels",{}).then(r=>{const p=r&&r.payload;labels=((p&&p.labels)||[]).filter(x=>x.labelType==="USER").sort((a,b)=>a.name.localeCompare(b.name,"fr"));renderAll()}).catch(()=>{})}
})();
</script>
