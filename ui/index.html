<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Enviro Travail</title>
<style>body{font:14px system-ui,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;background:#f3f2ee;color:#1c1c1a}@media (prefers-color-scheme:dark){body{background:#171716;color:#ecebe6}}</style>
</head><body><div>Chargement…</div>
<script>
(async()=>{
  try{
    const r=await window.__TAURI__.core.invoke("load_ui");
    document.open();document.write(r.html);document.close();
    if(r.updated){
      const v=(r.html.match(/name="enviro-ui" content="([^"]+)"/)||[])[1]||"";
      setTimeout(()=>{if(window.toast)window.toast("Interface mise à jour"+(v?" ("+v+")":""))},1800);
    }
  }catch(e){location.replace("app.html")}
})();
</script></body></html>
