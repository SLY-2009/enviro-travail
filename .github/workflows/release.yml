name: release
# Se declenche a chaque envoi (git push) sur la branche main, sans etiquette ni numero a changer a la main.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
      - name: Numero de version automatique
        shell: pwsh
        run: |
          $v = "0.2.${{ github.run_number }}"
          $f = "src-tauri/tauri.conf.json"
          $t = Get-Content $f -Raw
          $t = ([regex]'"version":\s*"[^"]*"').Replace($t, '"version": "' + $v + '"', 1)
          Set-Content $f $t -NoNewline
          $f = "src-tauri/Cargo.toml"
          $t = Get-Content $f -Raw
          $t = ([regex]'(?m)^version\s*=\s*"[^"]*"').Replace($t, 'version = "' + $v + '"', 1)
          Set-Content $f $t -NoNewline
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append
      - run: npm install
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v${{ env.VERSION }}
          releaseName: "Enviro Travail ${{ env.VERSION }}"
          releaseBody: "Telecharge le fichier se terminant par -setup.exe pour l'installer. L'application se met ensuite a jour toute seule."
          releaseDraft: false
          prerelease: false
